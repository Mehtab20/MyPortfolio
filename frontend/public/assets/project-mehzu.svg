<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="50%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#0D1525"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0.3" y1="0.2" x2="0.7" y2="0.8">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0.6" y1="0.3" x2="0.4" y2="0.9">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="glow3" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="40%" stop-color="#14b8a6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brain-glow" cx="0.5" cy="0.45" r="0.35">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#14b8a6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="big-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A3B42" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <!-- Node glow for features -->
    <filter id="node-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Glow orbs -->
  <ellipse cx="400" cy="180" rx="200" ry="140" fill="url(#glow1)"/>
  <ellipse cx="350" cy="250" rx="160" ry="120" fill="url(#glow2)"/>
  <rect x="100" y="50" width="600" height="1" fill="url(#accent-line)"/>
  <rect x="100" y="450" width="600" height="1" fill="url(#accent-line)"/>

  <!-- Central brain/AI icon area -->
  <ellipse cx="400" cy="180" rx="120" ry="100" fill="url(#brain-glow)"/>

  <!-- Neural network nodes and connections -->
  <!-- Connection lines -->
  <g opacity="0.25" stroke="#14b8a6" stroke-width="0.7" fill="none">
    <!-- Hub connections -->
    <line x1="400" y1="180" x2="520" y2="120"/>
    <line x1="400" y1="180" x2="520" y2="180"/>
    <line x1="400" y1="180" x2="520" y2="240"/>
    <line x1="400" y1="180" x2="280" y2="120"/>
    <line x1="400" y1="180" x2="280" y2="180"/>
    <line x1="400" y1="180" x2="280" y2="240"/>
    <line x1="400" y1="180" x2="400" y2="80"/>
    <line x1="400" y1="180" x2="400" y2="280"/>
    <line x1="400" y1="180" x2="340" y2="100"/>
    <line x1="400" y1="180" x2="460" y2="100"/>
    <line x1="400" y1="180" x2="340" y2="260"/>
    <line x1="400" y1="180" x2="460" y2="260"/>
    <!-- Inter-node connections -->
    <line x1="520" y1="120" x2="520" y2="180"/>
    <line x1="520" y1="180" x2="520" y2="240"/>
    <line x1="280" y1="120" x2="280" y2="180"/>
    <line x1="280" y1="180" x2="280" y2="240"/>
    <line x1="520" y1="120" x2="460" y2="100"/>
    <line x1="520" y1="240" x2="460" y2="260"/>
    <line x1="280" y1="120" x2="340" y2="100"/>
    <line x1="280" y1="240" x2="340" y2="260"/>
    <line x1="400" y1="80" x2="460" y2="100"/>
    <line x1="400" y1="80" x2="340" y2="100"/>
    <line x1="400" y1="280" x2="460" y2="260"/>
    <line x1="400" y1="280" x2="340" y2="260"/>
  </g>

  <!-- Outer nodes -->
  <g filter="url(#node-glow)">
    <!-- Top ring -->
    <circle cx="520" cy="120" r="5" fill="#14b8a6" opacity="0.6"/>
    <circle cx="520" cy="180" r="4" fill="#0d9488" opacity="0.4"/>
    <circle cx="520" cy="240" r="5" fill="#14b8a6" opacity="0.5"/>
    <circle cx="280" cy="120" r="4" fill="#0d9488" opacity="0.5"/>
    <circle cx="280" cy="180" r="5" fill="#14b8a6" opacity="0.4"/>
    <circle cx="280" cy="240" r="4" fill="#0d9488" opacity="0.6"/>
    <circle cx="400" cy="80" r="5" fill="#14b8a6" opacity="0.5"/>
    <circle cx="400" cy="280" r="5" fill="#14b8a6" opacity="0.4"/>
    <circle cx="340" cy="100" r="3" fill="#14b8a6" opacity="0.35"/>
    <circle cx="460" cy="100" r="3" fill="#14b8a6" opacity="0.35"/>
    <circle cx="340" cy="260" r="3" fill="#14b8a6" opacity="0.35"/>
    <circle cx="460" cy="260" r="3" fill="#14b8a6" opacity="0.35"/>
  </g>

  <!-- Center brain node -->
  <g filter="url(#soft-glow)">
    <circle cx="400" cy="180" r="28" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.4"/>
    <circle cx="400" cy="180" r="20" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.3"/>
    <circle cx="400" cy="180" r="8" fill="#14b8a6" opacity="0.5"/>
  </g>

  <!-- Brain wave rings -->
  <g filter="url(#big-glow)">
    <ellipse cx="400" cy="180" rx="55" ry="45" fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.12"/>
    <ellipse cx="400" cy="180" rx="70" ry="58" fill="none" stroke="#06b6d4" stroke-width="0.4" opacity="0.08"/>
    <ellipse cx="400" cy="180" rx="90" ry="75" fill="none" stroke="#14b8a6" stroke-width="0.3" opacity="0.05"/>
  </g>

  <!-- Title area -->
  <text x="400" y="330" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="8">MEHZU AI</text>
  
  <text x="400" y="358" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="4">YOUR LIFE · REMEMBERED · UNDERSTOOD · IMPROVED</text>

  <!-- Feature dots row -->
  <g opacity="0.3">
    <!-- Journal -->
    <circle cx="260" cy="390" r="3" fill="#14b8a6"/>
    <text x="272" y="393" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Journal</text>
    <!-- Health -->
    <circle cx="330" cy="390" r="3" fill="#0d9488"/>
    <text x="342" y="393" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Health</text>
    <!-- Habits -->
    <circle cx="398" cy="390" r="3" fill="#14b8a6"/>
    <text x="410" y="393" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Habits</text>
    <!-- Prayer -->
    <circle cx="468" cy="390" r="3" fill="#0d9488"/>
    <text x="480" y="393" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Prayer</text>
    <!-- Fitness -->
    <circle cx="540" cy="390" r="3" fill="#14b8a6"/>
    <text x="552" y="393" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Fitness</text>
  </g>

  <!-- Bottom accent -->
  <text x="400" y="430" text-anchor="middle" fill="#1e293b" font-family="system-ui, monospace" font-size="9" letter-spacing="6">AI PERSONAL OPERATING SYSTEM</text>

  <!-- Subtle teal decorative dots -->
  <circle cx="80" cy="50" r="2" fill="#14b8a6" opacity="0.08"/>
  <circle cx="720" cy="60" r="1.5" fill="#14b8a6" opacity="0.06"/>
  <circle cx="80" cy="440" r="1.5" fill="#14b8a6" opacity="0.06"/>
  <circle cx="720" cy="440" r="2" fill="#14b8a6" opacity="0.08"/>
</svg>
