<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg3)" rx="8"/>
  <!-- Browser Window -->
  <rect x="80" y="40" width="640" height="420" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <!-- Browser Header -->
  <rect x="80" y="40" width="640" height="36" rx="8" fill="#1f2937"/>
  <rect x="80" y="60" width="640" height="16" fill="#1f2937"/>
  <!-- Dots -->
  <circle cx="100" cy="58" r="5" fill="#ef4444"/>
  <circle cx="118" cy="58" r="5" fill="#f59e0b"/>
  <circle cx="136" cy="58" r="5" fill="#10b981"/>
  <!-- Sidebar -->
  <rect x="80" y="76" width="160" height="384" rx="0" fill="#0a0f1a"/>
  <rect x="96" y="96" width="128" height="8" rx="4" fill="#374151"/>
  <rect x="96" y="114" width="128" height="8" rx="4" fill="#374151"/>
  <rect x="96" y="132" width="128" height="8" rx="4" fill="#14b8a6"/>
  <rect x="96" y="150" width="128" height="8" rx="4" fill="#374151"/>
  <rect x="96" y="168" width="128" height="8" rx="4" fill="#374151"/>
  <!-- Chat Area - AI Message -->
  <rect x="260" y="96" width="280" height="60" rx="8" fill="#1f2937"/>
  <circle cx="280" cy="116" r="8" fill="url(#cyanGrad)"/>
  <text x="296" y="120" font-size="10" fill="#9ca3af" font-family="monospace">AI Assistant</text>
  <text x="280" y="140" font-size="10" fill="#d1d5db" font-family="sans-serif">How can I help you build your SaaS today?</text>
  <!-- Chat Area - User Message -->
  <rect x="340" y="176" width="200" height="40" rx="8" fill="#14b8a6" opacity="0.15"/>
  <text x="360" y="200" font-size="10" fill="#d1d5db" font-family="sans-serif">Set up Stripe integration please</text>
  <!-- Chat Input -->
  <rect x="260" y="240" width="400" height="36" rx="18" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="280" y="262" font-size="10" fill="#6b7280" font-family="sans-serif">Type your message...</text>
  <circle cx="630" cy="258" r="12" fill="url(#cyanGrad)"/>
  <!-- Stats Cards at bottom -->
  <rect x="260" y="350" width="120" height="60" rx="8" fill="#1f2937"/>
  <text x="280" y="375" font-size="18" font-weight="bold" fill="#14b8a6" font-family="monospace">1.2k</text>
  <text x="280" y="395" font-size="9" fill="#6b7280" font-family="sans-serif">API Calls</text>
  <rect x="395" y="350" width="120" height="60" rx="8" fill="#1f2937"/>
  <text x="415" y="375" font-size="18" font-weight="bold" fill="#06b6d4" font-family="monospace">99.9%</text>
  <text x="415" y="395" font-size="9" fill="#6b7280" font-family="sans-serif">Uptime</text>
  <rect x="530" y="350" width="120" height="60" rx="8" fill="#1f2937"/>
  <text x="550" y="375" font-size="18" font-weight="bold" fill="#2dd4bf" font-family="monospace">5+</text>
  <text x="550" y="395" font-size="9" fill="#6b7280" font-family="sans-serif">Providers</text>
  <!-- Status Badge -->
  <rect x="630" y="52" width="70" height="22" rx="11" fill="#06b6d4" opacity="0.15"/>
  <text x="640" y="66" font-size="9" fill="#06b6d4" font-family="monospace">Open Source</text>
</svg>
