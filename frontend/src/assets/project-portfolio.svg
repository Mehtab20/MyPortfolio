<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg4)" rx="8"/>
  <!-- Browser Window -->
  <rect x="80" y="40" width="640" height="420" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <!-- Browser Header -->
  <rect x="80" y="40" width="640" height="36" rx="8" fill="#1f2937"/>
  <rect x="80" y="60" width="640" height="16" fill="#1f2937"/>
  <circle cx="100" cy="58" r="5" fill="#ef4444"/>
  <circle cx="118" cy="58" r="5" fill="#f59e0b"/>
  <circle cx="136" cy="58" r="5" fill="#10b981"/>
  <!-- Hero Section -->
  <text x="120" y="120" font-size="32" font-weight="bold" fill="#f3f4f6" font-family="sans-serif">Mehtab <tspan fill="#14b8a6">Akbar</tspan></text>
  <rect x="120" y="136" width="120" height="22" rx="11" fill="#14b8a6" opacity="0.12"/>
  <text x="135" y="150" font-size="9" fill="#14b8a6" font-family="monospace">Full-Stack Engineer</text>
  <text x="120" y="176" font-size="11" fill="#9ca3af" font-family="sans-serif">Building AI-powered healthcare systems, cloud platforms,</text>
  <text x="120" y="192" font-size="11" fill="#9ca3af" font-family="sans-serif">and production-ready SaaS applications.</text>
  <!-- CTA Buttons -->
  <rect x="120" y="212" width="110" height="34" rx="8" fill="url(#emGrad)"/>
  <text x="140" y="233" font-size="10" fill="#030712" font-weight="bold" font-family="sans-serif">View Projects</text>
  <rect x="242" y="212" width="110" height="34" rx="8" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.4"/>
  <text x="265" y="233" font-size="10" fill="#14b8a6" font-family="sans-serif">Contact Me</text>
  <!-- Stats -->
  <rect x="120" y="266" width="90" height="50" rx="6" fill="#1f2937"/>
  <text x="140" y="290" font-size="20" font-weight="bold" fill="#14b8a6" font-family="monospace">4+</text>
  <text x="140" y="306" font-size="9" fill="#6b7280" font-family="sans-serif">Projects</text>
  <rect x="220" y="266" width="90" height="50" rx="6" fill="#1f2937"/>
  <text x="240" y="290" font-size="20" font-weight="bold" fill="#06b6d4" font-family="monospace">3+</text>
  <text x="240" y="306" font-size="9" fill="#6b7280" font-family="sans-serif">Years</text>
  <rect x="320" y="266" width="90" height="50" rx="6" fill="#1f2937"/>
  <text x="340" y="290" font-size="20" font-weight="bold" fill="#2dd4bf" font-family="monospace">8+</text>
  <text x="340" y="306" font-size="9" fill="#6b7280" font-family="sans-serif">Stacks</text>
  <!-- Project Cards -->
  <rect x="120" y="340" width="180" height="100" rx="8" fill="#1f2937"/>
  <rect x="120" y="340" width="180" height="36" rx="8" fill="#14b8a6" opacity="0.15"/>
  <text x="140" y="362" font-size="10" font-weight="bold" fill="#d1d5db" font-family="sans-serif">Medical Referral Agent</text>
  <text x="140" y="382" font-size="8" fill="#6b7280" font-family="sans-serif">AI Diagnostic & Referral</text>
  <text x="140" y="400" font-size="8" fill="#6b7280" font-family="sans-serif">Flutter + FastAPI + ML</text>
  <rect x="316" y="340" width="180" height="100" rx="8" fill="#1f2937"/>
  <rect x="316" y="340" width="180" height="36" rx="8" fill="#8b5cf6" opacity="0.15"/>
  <text x="336" y="362" font-size="10" font-weight="bold" fill="#d1d5db" font-family="sans-serif">Gohar Medical Trust</text>
  <text x="336" y="382" font-size="8" fill="#6b7280" font-family="sans-serif">Hospital Management</text>
  <text x="336" y="400" font-size="8" fill="#6b7280" font-family="sans-serif">React + Node.js + PostgreSQL</text>
  <!-- Status -->
  <rect x="630" y="52" width="70" height="22" rx="11" fill="#10b981" opacity="0.15"/>
  <text x="640" y="66" font-size="9" fill="#10b981" font-family="monospace">Live</text>
</svg>
